<!doctype html><html lang="lt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GamePermits — Žaidimo leidimai</title><link rel="stylesheet" href="/src/style.css"></head><body><header><div class="brand">🎣 <span>GamePermits</span></div><p>Virtualūs leidimai tavo žaidimo pasauliui</p></header><main class="container"><div id="notice" class="notice" hidden></div><div class="grid"><section class="card"><h2>📄 Sukurti leidimą</h2><label>Žaidėjo vardas</label><input id="name" placeholder="Pvz. Jonas Jonaitis" maxlength="80"><label>Leidimo tipas</label><select id="type"><option>🎣 Žvejybos leidimas</option><option>🦌 Medžioklės leidimas</option><option>🏗️ Statybos leidimas</option><option>🎣 Verslinės žvejybos leidimas</option><option>☢️ Pavojingų medžiagų pervežimas</option></select><label>Vieta / teritorija</label><select id="region"><option>Klaipėdos regionas</option><option>Vilniaus regionas</option><option>Kauno regionas</option></select><label>Galioja iki</label><input id="date" type="date"><button id="createBtn">Sugeneruoti leidimą</button><p class="small">Leidimai skirti žaidimo serveriui / virtualiam pasauliui.</p></section><section class="card"><h2>🔎 Patikrinti leidimą</h2><label>Leidimo numeris</label><input id="search" placeholder="Pvz. GP-2026-A1B2C3"><button id="verifyBtn">Patikrinti</button><div id="result" class="result" hidden></div></section></div><section class="card" style="margin-top:20px"><h2>🎫 Leidimas</h2><div id="permitArea" class="empty">Kol kas leidimas nepasirinktas.</div></section></main><footer>GamePermits v2 • Virtualių žaidimo leidimų sistema</footer><script type="module" src="/src/main.js"></script></body></html>
